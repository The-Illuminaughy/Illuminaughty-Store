<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>eStore | Illuminaughty® Store</title>
  <meta name="description" content="Browse the Illuminaughty® Store. Purchases are completed through Amazon.">
  <link rel="icon" href="/IlluminaughtyLogo.webp">
  <link rel="stylesheet" href="/assets/css/site.css">
</head>
<body data-email-subject="RE: Illuminaughty®">
  <div id="site-header"></div>
  <main>
    <section class="page-hero shell-width">
      <div class="eyebrow">Illuminaughty® Store</div>
      <h1>eStore</h1>
      <p>Browse Illuminaughty® products and shop directly through Amazon.</p>
    </section>
    <section class="store-section shell-width">
      <div id="store-status" class="store-status" role="status">Loading products…</div>
      <div id="product-grid" class="product-grid" aria-live="polite"></div>
    </section>
    <div class="shell-width affiliate-disclosure">As an Amazon Associate, Illuminaughty® may earn from qualifying purchases.</div>
  </main>
  <div id="site-footer"></div>
  <script src="/assets/js/site.js" defer></script>
  <script src="/assets/js/estore.js" defer></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const grid = document.getElementById('product-grid');
      if (!grid) return;

      const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

      function formatPriceUpdatedText(root) {
        const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
        const nodes = [];
        while (walker.nextNode()) nodes.push(walker.currentNode);

        nodes.forEach(node => {
          const value = node.nodeValue || '';
          const match = value.match(/Price\s+last\s+updated:\s*(\d{4})-(\d{2})-(\d{2})\s+(\d{1,2}):(\d{2})(?::\d{2})?\s+(EDT|EST)/i);
          if (!match) return;

          const year = Number(match[1]);
          const month = Number(match[2]);
          const day = Number(match[3]);
          let hour = Number(match[4]);
          const minute = match[5];
          const zone = match[6].toUpperCase();

          const period = hour >= 12 ? 'P.M.' : 'A.M.';
          hour = hour % 12 || 12;

          const formatted = `Price Last Updated on ${day} ${monthNames[month - 1]} ${year} at ${hour}:${minute} ${period} ${zone}`;
          node.nodeValue = value.replace(match[0], formatted);
        });
      }

      formatPriceUpdatedText(grid);

      const observer = new MutationObserver(() => formatPriceUpdatedText(grid));
      observer.observe(grid, { childList: true, subtree: true });
    });
  </script>
</body>
</html>
